# Chroma - nginx site. Installed by install.sh to /etc/nginx/sites-available/chroma
# (re-installed on every update; do not edit by hand, change deploy/nginx/chroma.conf in the repo).
server {
    # IPv4 only on purpose: the lab network is IPv4 and nginx refuses to start when [::]:80 is listed on a server with IPv6 disabled.
    listen 80 default_server;
    server_name _;

    root /opt/chroma/public;
    index index.php;

    access_log /var/log/chroma/nginx-access.log;
    error_log  /var/log/chroma/nginx-error.log warn;

    client_max_body_size 64m;
    charset utf-8;

    # Front controller: everything that is not a real file goes to index.php.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/chroma.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 300s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # No other PHP file is ever executed directly.
    location ~ \.php$ {
        return 404;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        # The app sends these on every page it renders (src/Core/Response.php); static files are served by nginx
        # directly, so they are repeated here (add_header in a location replaces, not extends, the server-level set).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        access_log off;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
