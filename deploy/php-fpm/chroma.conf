; Chroma - PHP-FPM pool. Installed by install.sh to /etc/php/8.3/fpm/pool.d/chroma.conf
[chroma]
user = chroma
group = chroma

listen = /run/php/chroma.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

; Uploads (attachments) - keep in step with client_max_body_size in the nginx site.
php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 64M
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 300
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/chroma/php-errors.log
php_admin_value[date.timezone] = UTC
php_admin_value[session.use_strict_mode] = 1
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.validate_timestamps] = 1
php_admin_value[opcache.revalidate_freq] = 2

catch_workers_output = yes
decorate_workers_output = no
clear_env = yes
env[PATH] = /usr/local/bin:/usr/bin:/bin
env[CHROMA_CONFIG] = /etc/chroma/config.env
